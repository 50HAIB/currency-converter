  <style>
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: rgba(16, 185, 129, 0.1);
      --bg-gradient: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-main: #064e3b;
      --text-muted: #047857;
      --border-color: #a7f3d0;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Dark mode support preference */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-gradient: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
        --card-bg: rgba(6, 78, 59, 0.85);
        --text-main: #ecfdf5;
        --text-muted: #6ee7b7;
        --border-color: #047857;
        --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 40px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 30px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        padding: 24px;
      }
    }

    /* Header / Titles */
    header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.025em;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* Form Controls */
    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    input[type="number"],
    select {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      transition: var(--transition);
      outline: none;
    }

    /* Dropdown options styling fix for dark/light mode */
    select option {
      background-color: #064e3b;
      color: #ffffff;
    }

    @media (prefers-color-scheme: light) {
      select option {
        background-color: #ffffff;
        color: #064e3b;
      }
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .dropdown-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    /* Buttons */
    button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    /* Display Area */
    .result-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.02);
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-md);
      padding: 30px;
      text-align: center;
      transition: var(--transition);
    }

    .result-wrapper.active {
      border-style: solid;
      border-color: var(--primary);
      background: transparent;
    }

    #exchange-rate {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      margin: 10px 0 5px 0;
    }

    .placeholder-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

            <option value="UYU">UYU - Uruguayan Peso</option>
            <option value="UZS">UZS - Uzbekistan Som</option>
            <option value="VES">VES - Venezuelan Bolívar</option>
            <option value="VND">VND - Vietnamese Dong</option>
            <option value="VUV">VUV - Vanuatu Vatu</option>
            <option value="WST">WST - Samoan Tala</option>
            <option value="XAF">XAF - CFA Franc BEAC</option>
            <option value="XCD">XCD - East Caribbean Dollar</option>
            <option value="XDR">XDR - Special Drawing Rights</option>
            <option value="XOF">XOF - CFA Franc BCEAO</option>
            <option value="XPF">XPF - CFP Franc</option>
            <option value="YER">YER - Yemeni Rial</option>
            <option value="ZAR">ZAR - South African Rand</option>
            <option value="ZMW">ZMW - Zambian Kwacha</option>
            <option value="ZWL" selected>ZWL - Zimbabwean Dollar</option>
          </select>
        </div>
      </div>

      <button id="convert-btn">Convert Currency</button>
    </div>

    <!-- Right Column: Result Display -->
    <div class="result-wrapper" id="result-wrapper">
      <p class="placeholder-text" id="placeholder-text">Your conversion result will appear here</p>
      <div id="result-container" class="hidden">
        <div class="placeholder-text">Converted Amount</div>
        <div id="exchange-rate">0.00</div>
        <div id="rate-details" class="placeholder-text"></div>
      </div>
    </div>
  </div>

  <script>
    const amountInput = document.getElementById('amount');
    const fromCurrencySelect = document.getElementById('from-currency');
    const toCurrencySelect = document.getElementById('to-currency');
    const convertBtn = document.getElementById('convert-btn');
    const resultWrapper = document.getElementById('result-wrapper');
    const placeholderText = document.getElementById('placeholder-text');
    const resultContainer = document.getElementById('result-container');
    const exchangeRateEl = document.getElementById('exchange-rate');
    const rateDetailsEl = document.getElementById('rate-details');

    async function convertCurrency() {
      const amount = parseFloat(amountInput.value);
      const from = fromCurrencySelect.value;
      const to = toCurrencySelect.value;

      if (isNaN(amount) || amount <= 0) {
        alert('Please enter a valid amount.');
        return;
      }

      try {
        const response = await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`);
        const data = await response.json();
        const rate = data.rates[to];
        const convertedAmount = (amount * rate).toFixed(2);

        exchangeRateEl.textContent = `${convertedAmount} ${to}`;
        rateDetailsEl.textContent = `1 ${from} = ${rate.toFixed(4)} ${to}`;

        // Update UI states
        resultWrapper.classList.add('active');
        placeholderText.classList.add('hidden');
        resultContainer.classList.remove('hidden');
      } catch (error) {
        alert('Failed to fetch exchange rates. Please try again later.');
      }
    }

    convertBtn.addEventListener('click', convertCurrency);
    
    // Trigger on Enter keypress
    [amountInput, fromCurrencySelect, toCurrencySelect].forEach(el => {
      el.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          convertCurrency();
        }
      });
    });
  </script>
</body>
</html>
